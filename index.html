<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="AutoMartaShow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>(function(){var u=navigator.userAgent||"";if(/iPhone|iPad|iPod/.test(u)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1))return;var l=document.createElement("link");l.rel="manifest";l.href="manifest.webmanifest";document.head.appendChild(l);})();</script>
<meta name="description" content="AUTOMARTASHOW katılımcı kayıt ve QR eşleşme uygulaması · Martaş Otomotiv">
<link rel="icon" href="ikon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="ikon-180.png">
<title>AUTOMARTASHOW</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Montserrat:wght@300;500;600;700;800&display=swap">
<style>
/* Yerleşim: tek sütunlu yaka kartı. Yukarıdan aşağı: AUTOMARTASHOW logosu, hesap bilgileri ve kişisel QR,
   işlemler, fuar bilgileri, markaların toplu logosu, en altta Martaş logosu. Tek açık tema bilinçli bir seçim:
   sponsor logoları beyaz zemine göre hazırlanır ve taslak da beyaz zeminlidir. */
:root{
  --kagit:#ffffff;
  --murekkep:#151314;
  --gri:#6d6667;
  --cizgi:#ddd7d7;
  --zemin:#f7f4f4;
  --kirmizi:#e1251b;
  --kirmizi-koyu:#b81b13;
  --yesil:#17784b;
  --yesil-zemin:#eaf5ef;
  --sari:#9a6a00;
  --sari-zemin:#fbf3e2;
  --font:'Montserrat','Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--kagit)}
body{margin:0;background:var(--kagit);color:var(--murekkep);font:500 15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
body.kilitli{overflow:hidden}
img{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--kirmizi);outline-offset:2px}

.sayfa{max-width:440px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;padding-block:24px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.govde{display:flex;flex-direction:column;gap:14px;flex:1}
.alt-bolum{display:flex;flex-direction:column;gap:16px;margin-top:auto;padding-top:8px}

/* Logo ve şehir yazısı */
.ust{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.wm{margin:0;font:300 clamp(25px,8.4vw,33px)/1 var(--font);letter-spacing:.005em;white-space:nowrap;padding-bottom:5px;border-bottom:2px solid var(--kirmizi)}
.wm b{font-weight:800}
.ust-logo{max-height:72px;width:auto}
.altyazi{display:flex;align-items:center;justify-content:center;gap:6px;min-height:24px;font:700 14px/1.2 var(--font);letter-spacing:.04em}
.altyazi input{width:190px;max-width:60vw;padding:6px 8px;border:1.5px solid var(--murekkep);border-radius:3px;font:700 14px var(--font);text-align:center}
.kalem{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border:0;background:none;color:var(--gri);cursor:pointer;border-radius:3px}
.kalem:hover{color:var(--kirmizi);background:var(--zemin)}
.kalem svg{width:15px;height:15px}

/* Alt kısım: fuar bilgileri, marka logoları, Martaş */
.fuar{border-top:1.5px solid var(--murekkep);border-bottom:1.5px solid var(--murekkep);padding:12px 4px;text-align:center}
.fuar small{display:block;font:700 9.5px var(--font);letter-spacing:.14em;color:var(--kirmizi);margin-bottom:4px}
.fuar p{margin:0;font:700 14px/1.5 var(--font)}
.fuar p+p{font-weight:500;font-size:13px;color:var(--gri)}
.logolar{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 16px}
.logolar img{height:30px;width:auto;max-width:96px;object-fit:contain}
.logolar img.bant{height:auto;max-height:170px;max-width:100%;flex-basis:100%;object-fit:contain}
.logo-bos{border:1.5px dashed var(--cizgi);background:none;padding:14px;color:var(--gri);font:600 12.5px var(--font);cursor:pointer;border-radius:3px;width:100%}
.logo-bos:hover{border-color:var(--kirmizi);color:var(--kirmizi)}
.imza{display:flex;justify-content:center;padding:6px 0 10px}
.imza svg{width:172px;height:auto}
.imza img{max-height:46px;width:auto}

/* Hesap kartı */
.rozetler{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}
.rozet{border:1.5px solid var(--murekkep);padding:7px 12px;font:700 10.5px/1 var(--font);letter-spacing:.09em}
.rozet.k{background:var(--kirmizi);border-color:var(--kirmizi);color:var(--kagit)}
.rozet.s{background:var(--murekkep);color:var(--kagit)}
.hesap{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.hesap h2{margin:2px 0 0;font:800 21px/1.2 var(--font);overflow-wrap:anywhere}
.hesap p{margin:0;font:600 13.5px/1.4 var(--font);color:var(--gri)}
.hesap .gsm{font:500 13px var(--mono);color:var(--murekkep)}

/* Düğmeler */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--murekkep);border-radius:3px;background:var(--kagit);color:var(--murekkep);font:700 12.5px/1.2 var(--font);letter-spacing:.07em;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .15s,color .15s}
.btn:hover{background:var(--zemin)}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px;flex:none}
.btn .btn-ikon{width:24px;height:24px;border-radius:6px;flex:none}
.btn-k{background:var(--kirmizi);border-color:var(--kirmizi);color:var(--kagit)}
.btn-k:hover{background:var(--kirmizi-koyu);border-color:var(--kirmizi-koyu)}
.btn-s{background:var(--murekkep);color:var(--kagit)}
.btn-s:hover{background:#2b2829}
.btn-b{min-height:58px;font-size:13.5px}
.btn:disabled{opacity:.36;cursor:not-allowed;transform:none}
.btn-ince{align-self:center;border:0;background:none;padding:10px;color:var(--gri);font:600 13px var(--font);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.btn-ince:hover{color:var(--kirmizi)}
.btn-tehlike{color:var(--kirmizi);border-color:var(--kirmizi)}
.ikili{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ikili .btn{font-size:11.5px;padding:10px 8px}
.ayrac{display:flex;align-items:center;gap:10px;margin-top:6px;font:700 10.5px var(--font);letter-spacing:.14em;color:var(--gri)}
.ayrac::before,.ayrac::after{content:"";flex:1;height:1px;background:var(--cizgi)}

/* QR kutusu */
.qrkutu{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(100%,250px);align-self:center;padding:14px 14px 12px;border:1.5px solid var(--murekkep);background:var(--kagit);cursor:zoom-in;font:inherit;color:inherit}
.qrkutu svg{width:100%;height:auto;display:block}
.qrkutu span{font:700 10px/1.35 var(--font);letter-spacing:.08em;text-align:center}

/* Formlar */
.form{display:flex;flex-direction:column;gap:12px}
.baslik{margin:0;font:800 15px/1.2 var(--font);letter-spacing:.06em;text-align:center}
.alan{display:flex;flex-direction:column;gap:5px}
.alan>span{font:700 10.5px var(--font);letter-spacing:.09em}
.alan input,.alan textarea,.alan select{width:100%;min-height:48px;padding:11px 12px;border:1.5px solid var(--murekkep);border-radius:3px;background:var(--kagit);font:500 16px var(--font)}
.alan select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--murekkep) 50%),linear-gradient(135deg,var(--murekkep) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.alan textarea{min-height:110px;resize:vertical;line-height:1.5}
.alan input::placeholder,.alan textarea::placeholder{color:#a19a9b}
.alan.hatali input{border-color:var(--kirmizi)}
.ipucu{font:500 12px var(--font);font-style:normal;color:var(--kirmizi)}
.kategoriler{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--murekkep)}
.kategoriler button{border:0;background:var(--kagit);padding:10px 4px;min-height:58px;font:700 10.5px/1.25 var(--font);letter-spacing:.05em;cursor:pointer}
.kategoriler button small{display:block;margin-top:2px;font:500 9.5px var(--font);letter-spacing:0;opacity:.75}
.kategoriler button+button{border-left:1.5px solid var(--murekkep)}
.kategoriler button[aria-pressed="true"]{background:var(--murekkep);color:var(--kagit)}
.secenekler{display:flex;flex-direction:column;gap:10px}
.secenek{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:78px;padding:14px 16px;border:1.5px solid var(--murekkep);border-radius:3px;background:var(--kagit);text-align:left;cursor:pointer;font:inherit;color:inherit}
.secenek:hover{background:var(--zemin)}
.secenek b{display:block;font:800 15px/1.2 var(--font);letter-spacing:.05em}
.secenek small{display:block;margin-top:4px;font:500 13px/1.35 var(--font);color:var(--gri)}
.secenek i{flex:none;font:700 24px/1 var(--font);font-style:normal;color:var(--kirmizi)}
.secili-tur{display:flex;align-items:center;gap:10px;border:1.5px solid var(--murekkep);padding:10px 12px}
.secili-tur span{flex:1;min-width:0;font:700 10.5px var(--font);letter-spacing:.09em;color:var(--gri)}
.secili-tur span b{display:block;margin-top:2px;font:800 14px var(--font);letter-spacing:.05em;color:var(--murekkep)}
.yeni-marka{display:flex;gap:8px;align-items:center}
.yeni-marka input{flex:1;min-width:0;min-height:42px;padding:8px 10px;border:1.5px solid var(--murekkep);border-radius:3px;font:600 14px var(--font)}
.yeni-marka .btn{width:auto;min-height:42px;flex:none}
.onay{display:flex;gap:10px;align-items:flex-start;font:500 12.5px/1.45 var(--font);color:var(--murekkep);cursor:pointer}
.onay input{width:20px;height:20px;margin:1px 0 0;flex:none;accent-color:var(--kirmizi)}
.hata{min-height:18px;color:var(--kirmizi);font:600 13px/1.4 var(--font);text-align:center}
.not{margin:0;color:var(--gri);font:500 12.5px/1.5 var(--font);text-align:center}
.not.sol{text-align:left}
.not b{color:var(--murekkep)}
.bant-bilgi{border:1.5px solid var(--murekkep);background:var(--zemin);padding:12px 14px;font:600 13px/1.45 var(--font);text-align:center}
.bant-bilgi b{color:var(--kirmizi)}
.bant-kuyruk{background:var(--sari-zemin);border-color:#c99a2e}

/* Listeler */
.arama{display:flex;align-items:center;gap:10px;border:1.5px solid var(--murekkep);padding:0 12px;min-height:52px;background:var(--kagit)}
.arama svg{width:22px;height:22px;flex:none}
.arama input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:600 18px var(--font);padding:12px 0}
.arama input::placeholder{color:var(--murekkep);font-weight:600;letter-spacing:.03em}
.suzgec{display:flex;flex-wrap:wrap;gap:6px}
.suzgec button{border:1.5px solid var(--cizgi);background:var(--kagit);padding:6px 9px;font:700 10.5px var(--font);letter-spacing:.05em;border-radius:3px;cursor:pointer}
.suzgec button[aria-pressed="true"]{border-color:var(--murekkep);background:var(--murekkep);color:var(--kagit)}
.suzgec button em{font-style:normal;opacity:.65;margin-left:3px}
.liste{border:1.5px solid var(--murekkep);max-height:58vh;overflow-y:auto;overscroll-behavior:contain}
.liste::-webkit-scrollbar{width:12px}
.liste::-webkit-scrollbar-thumb{background:var(--murekkep)}
.liste::-webkit-scrollbar-track{background:var(--kagit);border-left:1px solid var(--cizgi)}
.satir{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;border-bottom:1px solid var(--cizgi);background:var(--kagit);text-align:left;font:inherit;color:inherit}
button.satir{cursor:pointer}
button.satir:hover{background:var(--zemin)}
.satir:last-child{border-bottom:0}
.satir-bilgi{flex:1;min-width:0}
.satir-bilgi b{display:block;font:700 14px/1.3 var(--font);overflow-wrap:anywhere}
.satir-bilgi small{display:block;color:var(--gri);font:500 11.5px/1.45 var(--font);overflow-wrap:anywhere}
.satir-ok{flex:none;color:var(--gri);font:700 18px var(--font)}
.etiket{display:inline-block;padding:1px 5px;margin-right:4px;border:1px solid currentColor;font:700 9px/1.4 var(--font);letter-spacing:.05em;vertical-align:1px;color:var(--murekkep)}
.etiket.t{color:var(--kirmizi)}
.etiket.c{color:var(--gri)}
.etiket.y{background:var(--murekkep);color:var(--kagit);border-color:var(--murekkep)}
.etiket.s{color:var(--sari)}
.satir-eylem{display:flex;align-items:center;gap:4px;flex:none}
.link{border:0;background:none;padding:6px 4px;font:600 13px var(--font);text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}
.link:hover{color:var(--kirmizi)}
.ikon{display:grid;place-items:center;width:36px;height:36px;border:1.5px solid var(--cizgi);background:var(--kagit);border-radius:3px;cursor:pointer;padding:0}
.ikon:hover{border-color:var(--murekkep)}
.ikon svg{width:18px;height:18px}
.bos-durum{padding:24px 14px;text-align:center;color:var(--gri);font:500 13px/1.5 var(--font)}

/* Kişi detayı */
.detay{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;margin:0;border:1.5px solid var(--murekkep);padding:14px}
.detay dt{font:700 10px/1.8 var(--font);letter-spacing:.09em;color:var(--gri)}
.detay dd{margin:0;font:600 14px/1.5 var(--font);overflow-wrap:anywhere}

/* E-tablo sayfası */
.ust-etiket{margin:0;text-align:center;font:700 10px var(--font);letter-spacing:.12em}
.tablo-baslik{display:flex;align-items:center;gap:10px;border:1.5px solid var(--murekkep);padding:10px 12px;font:700 19px/1.25 var(--font);overflow-wrap:anywhere}
.tablo-baslik svg{width:22px;height:22px;flex:none}
.tablo-baslik small{display:block;font:500 12px var(--font);color:var(--gri)}
.sekmeler{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1.5px solid var(--murekkep)}
.sekmeler button{border:0;background:var(--kagit);padding:10px 6px;font:700 10.5px/1.25 var(--font);letter-spacing:.05em;cursor:pointer}
.sekmeler button+button{border-left:1.5px solid var(--murekkep)}
.sekmeler button[aria-selected="true"]{background:var(--murekkep);color:var(--kagit)}
.etablo-kap{overflow-x:auto;border:1.5px solid var(--murekkep);max-height:60vh;overflow-y:auto}
.etablo{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.etablo th{position:sticky;top:0;background:var(--zemin);text-align:left;padding:9px 8px;font:700 10px/1.2 var(--font);letter-spacing:.07em;border-bottom:1.5px solid var(--murekkep)}
.etablo th+th,.etablo td+td{border-left:1.5px solid var(--murekkep)}
.etablo td{padding:8px;border-bottom:1px solid var(--murekkep);vertical-align:top;height:40px;font:600 13px/1.35 var(--font)}
.etablo tr:last-child td{border-bottom:0}
.etablo td:first-child{width:1%;white-space:nowrap;font:500 11px/1.6 var(--mono)}
.etablo td small{display:block;font:500 11.5px/1.35 var(--font);color:var(--gri);overflow-wrap:anywhere}
.etablo td small i{font-style:normal;color:var(--kirmizi);font-weight:700}

/* Okutma ve sonuç */
.vizor{position:relative;width:100%;aspect-ratio:1/1;max-width:100%;background:var(--murekkep);border-radius:3px;overflow:hidden}
.vizor video{width:100%;height:100%;object-fit:cover;display:block}
.vizor::after{content:"";position:absolute;inset:18%;border:2px solid var(--kagit);box-shadow:0 0 0 999px rgba(21,19,20,.35)}
.durum{margin:0;min-height:20px;text-align:center;font:600 13.5px/1.45 var(--font)}
.durum.kirmizi{color:var(--kirmizi)}
.sonuc{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 8px 6px}
.isaret{display:grid;place-items:center;width:86px;height:86px;border-radius:50%;border:3px solid currentColor;margin-bottom:6px}
.isaret svg{width:44px;height:44px}
.sonuc-TAMAM .isaret{color:var(--yesil);background:var(--yesil-zemin)}
.sonuc-TEKRAR .isaret,.sonuc-KUYRUK .isaret{color:var(--sari);background:var(--sari-zemin)}
.sonuc-KENDI .isaret,.sonuc-YOK .isaret,.sonuc-GECERSIZ .isaret{color:var(--kirmizi);background:var(--zemin)}
.sonuc h2{margin:0;font:800 19px/1.2 var(--font);letter-spacing:.06em}
.sonuc .hedef-ad{margin:4px 0 0;font:800 24px/1.2 var(--font);overflow-wrap:anywhere}
.esles-cift{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:2px;font:700 16px var(--font)}
.esles-cift span{border:1.5px solid var(--murekkep);padding:6px 10px;font:800 12px var(--font);letter-spacing:.06em}
.esles-cift span.k{background:var(--kirmizi);border-color:var(--kirmizi);color:var(--kagit)}

/* Özet */
.kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi div{border:1.5px solid var(--murekkep);padding:12px}
.kpi b{display:block;font:800 26px/1.1 var(--font);font-variant-numeric:tabular-nums}
.kpi span{font:700 10px var(--font);letter-spacing:.09em;color:var(--gri)}
.bolum{display:flex;flex-direction:column;gap:10px}
.bolum h3{margin:0;font:800 11.5px var(--font);letter-spacing:.1em}
.cubuklar{display:flex;flex-direction:column;gap:9px}
.cubuk-satir{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font:600 12.5px var(--font)}
.cubuk-satir span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cubuk-satir em{font:500 11.5px var(--mono);font-style:normal;color:var(--gri);text-align:right}
.cubuk-yol{grid-column:1/-1;height:8px;background:var(--zemin)}
.cubuk-yol i{display:block;height:100%;background:var(--kirmizi)}
.saat-grafik{width:100%;height:auto;display:block}
.saat-grafik .c{fill:var(--kirmizi)}
.saat-grafik .z{fill:var(--zemin)}
.saat-grafik .e{fill:var(--gri);font:500 9px var(--mono)}
.saat-grafik .k{stroke:var(--cizgi);stroke-width:1}
.akis{display:flex;flex-direction:column}
.akis div{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--cizgi);font:600 12.5px/1.35 var(--font)}
.akis time{font:500 11px/1.6 var(--mono);color:var(--gri)}
.akis span{overflow-wrap:anywhere}
.akis span i{font-style:normal;color:var(--kirmizi);font-weight:700}

/* Ayarlar */
.kutu{display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px solid var(--murekkep)}
.kutu h3{margin:0;font:800 11.5px var(--font);letter-spacing:.1em}
.anahtar{display:flex;align-items:flex-start;gap:12px;cursor:pointer;font:600 13px/1.45 var(--font)}
.anahtar input{appearance:none;-webkit-appearance:none;flex:none;width:42px;height:24px;margin:0;border-radius:12px;background:var(--cizgi);position:relative;cursor:pointer;transition:background-color .15s}
.anahtar input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--kagit);transition:transform .15s}
.anahtar input:checked{background:var(--kirmizi)}
.anahtar input:checked::after{transform:translateX(18px)}
.anahtar small{display:block;font:500 12px/1.4 var(--font);color:var(--gri)}
.logo-izgara{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.logo-izgara figure{margin:0;display:flex;flex-direction:column;gap:6px;align-items:stretch;border:1px solid var(--cizgi);padding:8px}
.logo-izgara img{height:40px;width:100%;object-fit:contain}
.logo-izgara .bant{grid-column:1/-1}
.logo-izgara .bant img{height:auto;max-height:90px}
.logo-izgara button{border:0;background:none;color:var(--kirmizi);font:700 10.5px var(--font);letter-spacing:.06em;cursor:pointer;padding:4px}

/* Tam ekran QR */
.ov{position:fixed;inset:0;z-index:50;background:var(--kagit);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-ic{max-width:460px;min-height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.ov-ic h2{margin:0;font:800 22px/1.2 var(--font);overflow-wrap:anywhere}
.ov-qr{width:min(100%,56vh,400px);align-self:center;background:var(--kagit);padding:4px}
.ov-qr svg{width:100%;height:auto;display:block}
.ov-not{margin:0;font:500 13px/1.55 var(--font);color:var(--gri)}
.ov-not b{color:var(--murekkep)}
/* Ana ekrana ekle rehberi */
.ks-ikon{display:flex;flex-direction:column;align-items:center;gap:7px;align-self:center}
.ks-ikon img{width:76px;height:76px;border-radius:18px;box-shadow:0 2px 12px rgba(21,19,20,.2)}
.ks-ikon span{font:600 12px var(--font)}
.ks-adim{list-style:none;margin:0;padding:0;text-align:left;counter-reset:a}
.ks-adim li{counter-increment:a;display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--cizgi);font:500 14px/1.45 var(--font)}
.ks-adim li:last-child{border-bottom:1px solid var(--cizgi)}
.ks-adim li::before{content:counter(a);flex:0 0 26px;height:26px;border-radius:50%;background:var(--murekkep);color:var(--kagit);font:800 13px/26px var(--font);text-align:center}
.ks-adim b{font-weight:700}
.ks-simge{display:inline-block;width:20px;height:20px;vertical-align:-4px;color:#007aff}
.ov-onay{display:flex;justify-content:center;gap:8px;align-items:center;font:600 12.5px var(--font);cursor:pointer}
.ov-onay input{width:18px;height:18px;accent-color:var(--kirmizi)}
.giris-bilgi{display:inline-grid;grid-template-columns:auto auto;gap:4px 12px;margin:0 auto 6px;padding:10px 16px;border:2px dashed var(--kirmizi);text-align:left;font:600 13px var(--font);color:var(--murekkep)}
.giris-bilgi b{font:600 15px var(--mono);letter-spacing:.04em}

/* Yükleniyor ve bildirim */
.yukleniyor{display:flex;flex-direction:column;align-items:center;gap:14px;padding:40px 0;text-align:center}
.yukleniyor p{margin:0;font:600 13.5px var(--font);color:var(--gri)}
.serit{width:120px;height:3px;background:var(--zemin);overflow:hidden;position:relative}
.serit::after{content:"";position:absolute;inset:0;width:40%;background:var(--kirmizi);animation:serit 1s ease-in-out infinite alternate}
@keyframes serit{from{transform:translateX(-10%)}to{transform:translateX(160%)}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);padding:12px 16px;background:var(--murekkep);color:var(--kagit);font:600 13px/1.4 var(--font);border-radius:3px;box-shadow:0 6px 24px rgba(21,19,20,.25);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:600px){.sayfa{padding-block:40px 12px}}
</style>

<script>
(function () {
  'use strict';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function iki(n) { return (n < 10 ? '0' : '') + n; }

  function sayi(n) { return Number(n || 0).toLocaleString('tr-TR'); }
  function katla(s) { return String(s || '').replace(/[İIı]/g, 'i').toLowerCase().replace(/ş/g, 's').replace(/ğ/g, 'g').replace(/ü/g, 'u').replace(/ö/g, 'o').replace(/ç/g, 'c'); }
  function dosyaAdi(s) { return katla(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').toUpperCase() || 'QR'; }
  function emailOk(s) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(s || '').trim()); }
  function gsmCoz(s) {
    s = String(s || '').trim();
    var d = s.replace(/\D/g, ''), intl = /^(\+|00)/.test(s);
    if (intl) { if (s.indexOf('00') === 0) d = d.slice(2); if (d.indexOf('90') === 0) { d = d.slice(2); intl = false; } }

  var IKON = {

        .then(function (y) { if (!y.ok) throw 0; return y.json(); })
        .then(function (r) {

  function benAyarla(me) { S.me = me; depo.koy('ams3.ben', me); }
  function oturumAc(r) {

    mesgul(el, true, 'KAPATILIYOR…');
    api('oturumKapat', { sess: S.sess, id: el.getAttribute('data-id') }).then(function () {
      return kayitlariYukle().then(function () { yerindeCiz(); toast('Oturum kapatıldı. Kişi şimdi kendi telefonundan giriş yapabilir.'); });
    }).catch(function (e) { mesgul(el, false); hataIsle(e, 'kisi-hata'); });
  };
  ACT.sifreSifirla = function (el) {
    if (el.getAttribute('data-onay') !== '1') { el.setAttribute('data-onay', '1'); el.textContent = 'SIFIRLAMAK İÇİN TEKRAR DOKUNUN'; return; }
    mesgul(el, true, 'SIFIRLANIYOR…');
    api('sifreSifirla', { sess: S.sess, id: el.getAttribute('data-id') }).then(function () {
      return kayitlariYukle().then(function () { yerindeCiz(); toast('Şifre varsayılana döndü.'); });
    }).catch(function (e) { mesgul(el, false); hataIsle(e, 'kisi-hata'); });
  };
  ACT.girisGsm = function (el) { S.u = el.getAttribute('data-gsm') || ''; git('giris'); };
  ACT.girisQr = function () { qrGoster('UYGULAMA GİRİŞ QR KODU', kayitUrl(), { etiket: altEtiket(), not: 'Kayıtlı katılımcılar bu kodu okutup uygulamayı açar, GSM numarası ve şifreyle giriş yapar.' }); };
  ACT.girisQrKisi = function (el) {
    var h = (S.kayitlar || []).filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
    if (h) qrGoster('UYGULAMA GİRİŞİ', kayitUrl() + '?u=' + encodeURIComponent(String(h.gsm).replace(/\s/g, '')), { etiket: h.ad, not: 'Bu kod uygulamayı ' + esc(h.ad) + ' için GSM numarası hazır olarak açar.' });
  };
  ACT.hesapQr = function (el) { var h = (S.kayitlar || []).filter(function (x) { return x.id === el.getAttribute('data-id'); })[0]; if (h) qrGosterHesap(h); };
  ACT.markaQr = function (el) {
    var m = (S.v.liste || []).filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
    if (m) qrGoster(m.ad, qrMetni({ id: m.id, ad: m.ad }), { etiket: 'STANT QR KODU', not: 'Müşteri bu kodu kendi telefonuyla okutursa ' + esc(m.ad) + ' ile eşleşir.' });
  };
  ACT.kisi = function (el) { git('kisi', { id: el.getAttribute('data-id') }); };
  ACT.duzelt = function (el) { git('duzelt', { id: el.getAttribute('data-id') }); };
  ACT.rapor = function (el) { git('rapor', { tip: el.getAttribute('data-tip'), id: el.getAttribute('data-id') || '', sekme: el.getAttribute('data-s') || '' }); };
  ACT.sekme = function (el) { S.v.sekme = el.getAttribute('data-s'); ciz(); };
  ACT.suz = function (el) { S.v.f = el.getAttribute('data-f'); ciz(); };
  ACT.kat = function (el) {
    var k = el.getAttribute('data-k'), eski = S.v.kat || (S.gorunum === 'kayit' ? '' : KAT.M);
    if (eski === k) return;
    formuSakla();
    if (k === KAT.M && eski && eski !== KAT.M) S.v.firma = '';
    S.v.kat = k;
    yerindeCiz();
    var ilk = $('#ad'); if (ilk && !ilk.value && !$('#marka')) ilk.focus();
  };
  ACT.turDegistir = function () { formuSakla(); S.v.kat = ''; yerindeCiz(); };
  ACT.markaAc = function (el) { $('#yeni-marka').hidden = false; el.hidden = true; $('#yeni-marka-ad').focus(); };
  ACT.markaHizli = function (el) {
    var ad = $('#yeni-marka-ad').value.trim();
    if (ad.length < 2) return $('#yeni-marka-ad').focus();
    mesgul(el, true, '…');
    api('markaEkle', { sess: S.sess, adlar: [ad] }).then(function (r) {
      S.markalar = r.markalar; onbellegeYaz();
      formuSakla();
      S.v.marka = r.sonuc[0].id || (S.markalar.filter(function (m) { return katla(m.ad) === katla(ad); })[0] || {}).id;
      yerindeCiz();
      toast(r.sonuc[0].durum === 'EKLENDİ' ? r.sonuc[0].ad + ' markası eklendi ve seçildi.' : r.sonuc[0].mesaj);
    }).catch(function (e) { mesgul(el, false); hataIsle(e, 'k-hata'); });
  };
  ACT.yetki = function (el) {
    var id = el.getAttribute('data-id'), y = el.getAttribute('data-y');
    mesgul(el, true, '…');
    api('yetkiDegistir', { sess: S.sess, id: id, yetki: y }).then(function (r) {
      return kayitlariYukle().then(function () { if (S.gorunum === 'yoneticiler') S.v.ara = ''; ciz(); toast(r.hesap.ad + (y === 'YONETICI' ? ' artık yönetici.' : ' yöneticilikten çıkarıldı.')); });
    }).catch(function (e) { mesgul(el, false); hataIsle(e, 'kisi-hata'); });
  };
  ACT.sil = function (el) {
    if (el.getAttribute('data-onay') !== '1') { el.setAttribute('data-onay', '1'); el.textContent = 'SİLMEK İÇİN TEKRAR DOKUNUN'; return; }
    mesgul(el, true, 'SİLİNİYOR…');
    api('hesapSil', { sess: S.sess, id: el.getAttribute('data-id') }).then(function () {
      return kayitlariYukle().then(function () { git('kayitlar'); toast('Kayıt silindi. SİLİNEN listesinden geri alabilirsiniz.'); });
    }).catch(function (e) { mesgul(el, false); hataIsle(e, 'kisi-hata'); });
  };
  ACT.geriAl = function (el) {
    mesgul(el, true, 'GERİ ALINIYOR…');
    api('hesapGeriAl', { sess: S.sess, id: el.getAttribute('data-id') }).then(function (r) {
      return kayitlariYukle().then(function () { git('kisi', { id: r.hesap.id }); toast('Kayıt geri alındı.'); });
    }).catch(function (e) { mesgul(el, false); hataIsle(e, 'kisi-hata'); });
  };
  ACT.markaSil = function (el) {
    if (el.getAttribute('data-onay') !== '1') { el.setAttribute('data-onay', '1'); el.textContent = 'emin misiniz?'; return; }
    api('markaSil', { sess: S.sess, id: el.getAttribute('data-id') }).then(function (r) { S.markalar = r.markalar; onbellegeYaz(); S.v.liste = null; ciz(); toast('Marka listeden kaldırıldı.'); })
      .catch(function (e) { hataIsle(e); });
  };
  ACT.raporCsv = function () {
    var d = S.v.veri; if (!d) return;
    if (S.v._sekme === 'marka') {
      var mr = S.v.tip === 'marka' ? d : d.marka;
      return indir(dosyaAdi(mr.marka.ad) + '-stant-eslesmeleri.csv', csvYap(['TARİH-SAAT', 'KİŞİ', 'KATEGORİ', 'FİRMA', 'GÖREVİ', 'GSM', 'E-MAIL', 'MARKA PERSONELİ'],
        mr.eslesmeler.map(function (r) { return [tarih(r.t), r.ad, r.kat, r.firma, r.gorev, r.gsm, r.email, r.personel]; })), 'text/csv;charset=utf-8');
    }
    var sekme = S.v._sekme === 'okutuldu' ? 'okutuldu' : 'okuttu';
    indir(dosyaAdi(d.hesap.ad) + (sekme === 'okuttu' ? '-okuttuklari' : '-okutanlar') + '.csv', csvYap(['TARİH-SAAT', sekme === 'okuttu' ? 'OKUTULAN' : 'OKUTAN', 'KATEGORİ', 'FİRMA', 'GÖREVİ', 'GSM', 'E-MAIL', 'MARKA'],
      d[sekme].map(function (r) { return [tarih(r.t), r.ad, r.kat, r.firma, r.gorev, r.gsm, r.email, r.marka]; })), 'text/csv;charset=utf-8');
  };
  ACT.eslesmeCsv = function () { eslesmeCsv(eslesmeSuz(), 'AUTOMARTASHOW-eslesmeler' + (S.v.marka ? '-' + dosyaAdi(S.v.marka) : '') + '.csv'); };
  ACT.eslesmeCsvTum = function (el) {
    mesgul(el, true, 'HAZIRLANIYOR…');
    api('eslesmeler', { sess: S.sess }).then(function (r) { mesgul(el, false); return eslesmeCsv(r.satirlar, 'AUTOMARTASHOW-eslesmeler.csv'); }).catch(function (e) { mesgul(el, false); hataIsle(e); });
  };
  ACT.kayitCsv = function (el) {
    mesgul(el, true, 'HAZIRLANIYOR…');
    kayitlariYukle().then(function (l) {
      mesgul(el, false);
      return indir('AUTOMARTASHOW-kayitlar.csv', csvYap(['KATEGORİ', 'MARKA', 'ADI SOYADI', 'FİRMA', 'GÖREVİ', 'GSM', 'E-MAIL', 'YETKİ', 'DURUM', 'KAYIT TARİHİ', 'KAYDEDEN', 'OKUTTUĞU', 'OKUTULDUĞU'],
        l.map(function (h) { return [h.kat, h.markaAd, h.ad, h.firma, h.gorev, h.gsm, h.email, h.yetki, h.durum, tarih(h.kayit), h.kaydeden, h.okuttu, h.okutuldu]; })), 'text/csv;charset=utf-8');
    }).catch(function (e) { mesgul(el, false); hataIsle(e); });
  };
  ACT.ayarKaydet = function (el) {
    var g = el.getAttribute('data-grup'), o = {};
    if (g === 'yazi') { o.ALT_YAZI = $('#a-alt').value; o.FUAR_BILGI = $('#a-fuar').value; }
    if (g === 'sifre') { o.KULLANICI_SIFRESI = $('#a-ks').value; }
    if (g === 'okutma') { o.UYGULAMA_ADRESI = $('#a-uygulama').value; o.OKUTMA_SAYFASI = $('#a-okutma').value; }
    if (g === 'secenek') {
      ['KENDI_KAYIT', 'YONETICI_DUZENLER', 'KVKK_ONAY'].forEach(function (k) { o[k] = $('#' + k).checked ? 'EVET' : 'HAYIR'; });
      o.KVKK_METNI = $('#a-kvkk').value;
    }
    mesgul(el, true, 'KAYDEDİLİYOR…');
    api('ayarKaydet', { sess: S.sess, ayarlar: o }).then(function (r) {
      S.cfg = r.cfg; onbellegeYaz();
      return api('ayarlariGetir', { sess: S.sess }).then(function (a) { S.v.ayar = a.ayarlar; yerindeCiz(); toast(g === 'sifre' ? 'Varsayılan şifre kaydedildi.' : 'Kaydedildi.'); });
    }).catch(function (e) { mesgul(el, false); hataIsle(e); });
  };
  ACT.zip = function (el) { standZip(el); };
  ACT.foto = function () { foto.click(); };
  ACT.simOkut = function () { var s = $('#sim'); if (s && s.value) okutGonder(s.value); };
  ACT.altDuzenle = function () {
    var k = $('#altyazi');
    k.innerHTML = '<input id="alt-girdi" maxlength="60" value="' + esc(S.cfg.alt) + '" aria-label="Logonun altındaki yazı"><button class="kalem" data-x="altKaydet" aria-label="Kaydet" title="Kaydet">' + IKON.tamam + '</button>';
    var i = $('#alt-girdi'); i.focus(); i.select();
    i.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); ACT.altKaydet(); } if (e.key === 'Escape') ciz(); });
  };
  ACT.altKaydet = function () {
    var i = $('#alt-girdi');
    api('ayarKaydet', { sess: S.sess, ayarlar: { ALT_YAZI: i ? i.value : S.cfg.alt } }).then(function (r) { S.cfg = r.cfg; onbellegeYaz(); ciz(); toast('Yazı güncellendi.'); }).catch(function (e) { hataIsle(e); });
  };
  ACT.logoYukle = function (el) { logoTur = el.getAttribute('data-t'); logoDosya.multiple = logoTur === 'SPONSOR'; logoDosya.click(); };
  ACT.logoSil = function (el) {
    if (el.getAttribute('data-onay') !== '1') { el.setAttribute('data-onay', '1'); el.textContent = 'EMİN MİSİNİZ?'; return; }
    mesgul(el, true, 'SİLİNİYOR…');
    api('logoSil', { sess: S.sess, id: el.getAttribute('data-id') }).then(function (r) { S.logolar = r.logolar; S.logoSurum = r.logoSurum; onbellegeYaz(); yerindeCiz(); toast('Logo kaldırıldı.'); })
      .catch(function (e) { mesgul(el, false); hataIsle(e); });
  };

  /* ------------------------------------------------------------------ açılış */
  function konum(cb) {
    if (UZAK) {
      var o = {};
      try { new URLSearchParams(location.search).forEach(function (v, k) { o[k] = v; }); } catch (e) { /* eski tarayıcı */ }
      // Ana ekran kısayolu (?s=kimlik.anahtar): yalnızca ana ekrandan açılan uygulamada ve telefonda oturum yokken kullanılır
      if (o.s) {
        var par = String(o.s).split('.');
        if (ekranUygulamasi() && !S.sess && par.length === 2 && /^[KM][0-9A-Z]{4,20}$/.test(par[0]) && /^[\w-]{8,80}$/.test(par[1])) {
          S.sess = { id: par[0], key: par[1] }; S.me = null; depo.koy('ams3.oturum', S.sess);
        }
        delete o.s;
      }
      // Okutma bağlantısı (?q=) ve kısayol anahtarı işlendikten sonra adresten silinir; sayfa yenilenince tekrar kullanılmaz
      if (o.q || /[?&]s=/.test(location.search)) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* yok */ } }
      return cb(o);
    }
    try { google.script.url.getLocation(function (l) { cb((l && l.parameter) || {}); }); }
    catch (e) { cb({}); }
  }
  function yukle() {
    if (S.q) S.kayitModu = false;
    if (S.q) git('yukle', { metin: S.me ? 'QR kaydediliyor…' : 'Yükleniyor…' }, true);
    else if (S.me) git('ana', null, true);
    else if (S.kayitModu) git('kayit', null, true);
    else if (S.sess) git('yukle', { metin: 'Hesabınız açılıyor…' }, true);
    else if (onbellek) git('giris', null, true);
    else git('yukle', null, true);
    api('init', { sess: S.sess, q: S.q, logoSurum: S.logoSurum }).then(function (r) {
      S.url = r.url || S.url; S.exec = r.exec || S.exec; S.cfg = r.cfg; S.markalar = r.markalar || [];
      if (r.logolar) { S.logolar = r.logolar; S.logoSurum = r.logoSurum; }
      onbellegeYaz();
      if (r.oturumGecersiz) { yerelCikis(); toast(r.oturumMesaj || 'Oturumunuz kapanmış. Lütfen tekrar giriş yapın.'); }
      if (r.me) benAyarla(r.me);
      S.hedef = r.hedef || null;
      if (r.okutma) { kuyrukGonder(); return sonucGoster(r.okutma); }
      kuyrukGonder();
      if (S.kayitModu && S.me) { S.kayitModu = false; toast('Bu telefonda zaten hesabınız açık. Kişisel QR kodunuz ana sayfanızda.'); }
      if (S.gorunum === 'kayit') { formuSakla(); if (S.me) git('ana', null, true); else yerindeCiz(); return; }
      if (S.kayitModu && S.gorunum === 'yukle') return git('kayit', null, true);
      // Kullanıcı giriş formuna yazmaya başladıysa ya da giriş isteği gönderdiyse ekran yeniden çizilmez
      var yaziyor = S.gorunum === 'giris' && (S.girisBekliyor || ($('#deger') && $('#deger').value && !S.u) || ($('#sifre') && $('#sifre').value));
      if (['yukle', 'giris', 'ana'].indexOf(S.gorunum) >= 0 && !yaziyor) git(S.me ? 'ana' : 'giris', S.gorunum === 'ana' ? S.v : null, true);
    }).catch(function (e) {
      if (S.gorunum === 'yukle') git('yukle', { hata: true, metin: e.msg || 'Bağlantı kurulamadı.' }, true);
      else toast(e.msg || 'Bağlantı kurulamadı.');
    });
  }

  // GitHub adresinde: uygulama internet yokken de açılsın (sw.js); Google adresinde kullanılmaz
  if (UZAK && 'serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () { /* desteklenmiyor */ }); } catch (e) { /* yok */ } }
  window.AMS = { oturumAc: oturumAc, git: git, cikis: function () { return cikis(true); }, yerelCikis: yerelCikis, yukle: yukle, durum: S };
  konum(function (p) { S.q = p.q || ''; S.u = p.u || ''; S.kayitModu = p.kayit !== undefined && !S.q; yukle(); });
})();
</script>
